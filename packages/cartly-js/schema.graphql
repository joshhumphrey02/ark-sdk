  """
  Which front-end draws the store at X-Storefront-Host and whether it is online, so a front-end serves only its own stores. NOT_FOUND for a host no store uses.
  """
  storefrontRoute: StorefrontRoute!

  """
  Title, description, canonical URL, robots, Open Graph, X card and JSON-LD for one page. NOT_FOUND for anything not public.
  """
  storefrontSeo(input: SeoDocumentInput!): SeoDocument!

  """Whether the business serves (delivers to) this point."""
  storefrontServiceCoverage(latitude: Float!, longitude: Float!): ServiceAreaCoverage!

  """A service’s published reviews, newest first, with its rating summary."""
  storefrontServiceReviews(page: PageInput, slug: String!): ServiceReviews!
  storefrontShippingMethods: [ShippingMethod!]!

  """
  Shopper sign-in methods Cartly has switched on besides email and password: "google", "apple". Start one at GET /api/v1/storefront/oauth/{provider}/start.
  """
  storefrontSignInProviders: [String!]!

  """
  Serve at /sitemap.xml (no name) and /sitemap/<name>.xml. NOT_FOUND for a file that does not exist.
  """
