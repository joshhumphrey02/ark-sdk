  entityDefinitionHistory(key: String!): [EntityDefinitionVersion!]!
  entityDefinitions: [EntityDefinition!]!
  entityRecord(definitionKey: String!, id: ID!): EntityRecord!
  entityRecords(definitionKey: String!, filters: [EntityRecordFilterInput!], page: PageInput, q: String, status: EntityRecordStatus): EntityRecordPage!

  """NOT_FOUND for an event the caller may not see."""
