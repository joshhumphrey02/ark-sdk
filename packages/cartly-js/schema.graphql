"""
Who draws the store at X-Storefront-Host, and whether it is online. Answers for offline stores too.
"""
type StorefrontRoute {
  """
  Published: show the store. False: show a "not online" page (draft previews still work).
  """
  live: Boolean!
  renderer: StorefrontRenderer!
}

"""
Which front-end draws a store: STOREFRONT (Cartly’s storefront app), ENGINE (the storefront engine: stores made in the website builder) or MERCHANT (the merchant’s own server).
"""
enum StorefrontRenderer {
  ENGINE
  MERCHANT
  STOREFRONT
}

"""Which page of the store to describe."""
input SeoDocumentInput {
  """PAGE without an SEO record: its description."""
  description: String

  """PAGE: the path, e.g. /about."""
  path: String

  """
  The request’s query string: `page` keeps its own canonical; filters and sorting are noindexed and canonicalised to the plain listing; tracking parameters are ignored.
  """
  query: String
  resource: SeoResourceKind!

  """PRODUCT, CATEGORY, COLLECTION, PROPERTY: the slug from the URL."""
  slug: String

  """PAGE without an SEO record (e.g. /shop): its title."""
  title: String
}

type ServiceAreaCoverage {
  areas: [ServiceAreaRef!]!
  covered: Boolean!

  """False when the business does not use service areas."""
  enabled: Boolean!
}

type ServiceAreaRef {
  id: ID!
  name: String!
}

"""Published reviews only."""
type ServiceReviews {
  averageRating: Float

  """5 to 1 stars."""
  distribution: [RatingCount!]!
  page: StorefrontServiceReviewPage!
  reviewCount: Int!
}

type StorefrontServiceReviewPage {
  items: [ServiceReview!]!
  pageInfo: PageInfo!
}

type ServiceReview {
  authorName: String!
  body: String!
  createdAt: DateTime!
  id: ID!

  """1–5."""
  rating: Int!

  """The business’s public reply."""
  reply: String
  title: String

  """The customer had a completed booking of the service."""
  verifiedBooking: Boolean!
}

type StorefrontTemplateDetail {
  description: String!
  documents: [StorefrontTemplatePage!]!
  group: String!
  key: ID!
  name: String!
  pages: [StorefrontTemplatePageInfo!]!

  """Made for one of this business’s types."""
  recommended: Boolean!
  style: String!
  theme: JSON!

  """
  Capabilities its live blocks read; without them those blocks stay empty.
  """
  uses: [String!]!
}

type StorefrontTemplatePage {
  document: JSON!
  kind: StorefrontPageKind!
  path: String!
  title: String!
}

type StorefrontTemplatePageInfo {
  kind: StorefrontPageKind!
  path: String!
  title: String!
}

type StorefrontTemplateSummary {
  description: String!
  group: String!
  key: ID!
  name: String!
  pages: [StorefrontTemplatePageInfo!]!

  """Made for one of this business’s types."""
  recommended: Boolean!
  style: String!
  theme: JSON!

  """
  Capabilities its live blocks read; without them those blocks stay empty.
  """
  uses: [String!]!
}

"""
The published header, footer, theme and menu a store draws around every route while it uses the builder.
"""
type StorefrontVisualChrome {
  data: JSON!
  footer: JSON
  header: JSON
  navigation: [StorefrontNavLink!]!
  theme: JSON!
}

type SubscriptionOverview {
  entitlements: [Entitlement!]!
  subscription: PlanSubscription
}

"""
What the business may use right now, after package, grants and overrides.
"""
type Entitlement {
  description: String!
  enabled: Boolean!
  key: String!
  limit: Float

  """
  package, override (an administrative replacement), addon (raised by add-ons) or none.
  """
  source: String!
  unlimited: Boolean!
}

type PlanSubscription {
  autoRenew: Boolean!
  billingInterval: BillingInterval
  cancelAtPeriodEnd: Boolean!
  currentPeriodEnd: DateTime!
  currentPeriodStart: DateTime!
  graceEndsAt: DateTime
  id: ID!
  package: SubscriptionPackageRef!
  packagePriceId: ID

  """A downgrade scheduled for the end of the period."""
  pendingPackagePriceId: ID
  status: SubscriptionStatus!
}

type SubscriptionPackageRef {
  id: ID!
  key: String
  name: String
}

enum SubscriptionStatus {
  ACTIVE
  CANCELLED
  EXPIRED
  PAST_DUE
  PROMOTIONAL
  SUSPENDED
  TRIALING
}

type SubscriptionEventPage {
  items: [SubscriptionEvent!]!
  pageInfo: PageInfo!
}

type SubscriptionEvent {
  actorType: ActorType!
  fromPackageId: ID
  fromStatus: SubscriptionStatus
  id: ID!
  occurredAt: DateTime!
  reason: String
  toPackageId: ID
  toStatus: SubscriptionStatus
  type: SubscriptionEventType!
}

enum SubscriptionEventType {
  ACTIVATED
  CANCELLATION_SCHEDULED
  CANCELLED
  CREATED
  DOWNGRADED
  DOWNGRADE_SCHEDULED
  EXPIRED
  MANUAL_ADJUSTMENT
  PAST_DUE
  PROMOTION_ENDED
  PROMOTION_STARTED
  REACTIVATED
  RENEWAL_FAILED
  RENEWED
  SUSPENDED
  TRIAL_STARTED
  UPGRADED
}

type TaxRate {
  countryCode: String!
  id: ID!
  isInclusive: Boolean!
  name: String!
  ratePercent: Decimal!
  regionCode: String
}

input BusinessTicketOrderFilter {
  """One event only."""
  eventId: ID

  """Reference, buyer name or email."""
  q: String
  status: TicketOrderStatus
}

"""The signed-in user."""
type Viewer {
  """Profile photo; the URL changes when the photo does."""
  avatarUrl: String
  businesses: [ViewerBusiness!]!
  createdAt: DateTime!

  """
  Null until they set one: accounts made from the sign-in form, and Apple or Google sign-ins that withhold it, have no name.
  """
  displayName: String
  email: String!
  emailVerified: Boolean!

  """False for accounts that only sign in with Google or Apple."""
  hasPassword: Boolean!
  id: ID!
  mfaEnabled: Boolean!
  phone: String

  """Recovery address; counts once verified."""
  secondaryEmail: String
  secondaryEmailVerified: Boolean!
  termsAcceptedAt: DateTime

  """The terms version accepted at sign-up; null when none was recorded."""
  termsAcceptedVersion: String
}

"""
A business the viewer belongs to. Send its id as X-Tenant-Id for tenant operations.
"""
type ViewerBusiness {
  id: ID!
  membershipId: ID!
  name: String!
  roles: [RoleRef!]!
  slug: String!
  status: TenantStatus!
  verticals: [BusinessVertical!]!
}

type Viewing {
  agentId: ID
  cancellationReason: String
  clientId: ID
  completedAt: DateTime
  createdAt: DateTime!
  enquiryId: ID
  id: ID!
  note: String
  propertyId: ID!
  scheduledEnd: DateTime!
  scheduledStart: DateTime!
  status: ViewingStatus!
}

enum ViewingStatus {
  CANCELLED
  COMPLETED
  CONFIRMED
  NO_SHOW
  REQUESTED
  RESCHEDULED
}

input ViewingFilter {
  agentId: ID
  from: DateTime
  propertyId: ID
  status: ViewingStatus
  to: DateTime
}

type WebhookDeliveryPage {
  items: [WebhookDelivery!]!
  pageInfo: PageInfo!
}

type WebhookDelivery {
  attempts: Int!
  createdAt: DateTime!
  deliveredAt: DateTime
  eventType: String!
  id: ID!
  lastError: String
  lastStatusCode: Int
  nextAttemptAt: DateTime!

  """The event’s data, as sent."""
  payload: JSON!
  status: WebhookDeliveryStatus!
}

enum WebhookDeliveryStatus {
  FAILED
  PENDING
  SUCCEEDED
}

"""
Where Cartly sends a business’s events (its secret is never shown again).
"""
type WebhookEndpoint {
  """Failed attempts in a row; at 50 Cartly switches the endpoint off."""
  consecutiveFailures: Int!
  createdAt: DateTime!
  description: String
  disabledReason: String
  events: [String!]!
  id: ID!
  status: WebhookEndpointStatus!
  updatedAt: DateTime!
  url: String!
}

enum WebhookEndpointStatus {
  ACTIVE
  DISABLED
}

type WebhookEventType {
  description: String!

  """e.g. order.paid"""
  name: String!
}

"""
The business’s own website: what renders it, whether it is live and where, and its traffic.
"""
type WebsiteOverview {
  """Null until Cartly assigns the built storefront."""
  build: WebsiteBuild

  """Published, with a running storefront: visitors see it."""
  live: Boolean!

  """The address visitors use (primary domain), when live."""
  liveUrl: String

  """
  Every day of the range, oldest first (empty without a built storefront).
  """
  series: [StorefrontTrafficDay!]!

  """Over the requested days; null without a built storefront."""
  traffic: StorefrontTrafficTotals
}

"""The built storefront that renders this business’s website."""
type WebsiteBuild {
  """When it was assigned to this business."""
  assignedAt: DateTime
  category: String

  """
  When the storefront app last reported it (it reports every minute while running).
  """
  lastSeenAt: DateTime
  name: String!

  """ACTIVE, SUSPENDED (shut down by Cartly) or RETIRED."""
  status: String!
}

"""One UTC day of a storefront’s (or every storefront’s) traffic."""
type StorefrontTrafficDay {
  averageMs: Float
  bytesSent: Float!

  """YYYY-MM-DD (UTC)."""
  day: String!
  pageViews: Float!
  requests: Float!
  status2xx: Float!
  status3xx: Float!
  status4xx: Float!
  status5xx: Float!
  visitors: Float!
}

"""A storefront’s traffic over a range."""
type StorefrontTrafficTotals {
  """Average response time, ms."""
  averageMs: Float

  """Bandwidth: response bytes sent."""
  bytesSent: Float!

  """Responses with a 5xx status."""
  errors5xx: Float!

  """HTML page responses (not assets or API calls)."""
  pageViews: Float!
  requests: Float!

  """Unique visitors (approximate)."""
  visitors: Float!
}

"""
A page of the business’s custom storefront, as the storefront declares it.
"""
type WebsitePage {
  """
  PAGE and LEGAL: the content page at its path; null until one is saved (the store shows its own words).
  """
  content: WebsitePageContent

  """What the page shows and what of it can be edited."""
  description: String
  editIn: WebsitePageEditor
  kind: WebsitePageKind!

  """PAGE and LEGAL: the kind a new content page is created with."""
  pageKind: SeoPageKind

  """e.g. /about, or /services/[slug] for a TEMPLATE."""
  path: String!
  title: String!
}

"""The content page saved for a website page."""
type WebsitePageContent {
  id: ID!
  isPublished: Boolean!
  title: String!
  updatedAt: DateTime!
}

"""Where a TEMPLATE page’s items are edited."""
enum WebsitePageEditor {
  COLLECTIONS
  EVENTS
  PRODUCTS
  PROPERTIES
  SERVICES
}

"""
HOME: the home page (Settings → Home page). PAGE, LEGAL: words and pictures from the content page at its path. TEMPLATE: one page per item, edited where `editIn` says.
"""
enum WebsitePageKind {
  HOME
  LEGAL
  PAGE
  TEMPLATE
}

type Mutation {
  """Invitee side: the signed-in user’s email must match the invitation."""
  acceptInvitation(token: String!): InvitationAcceptance!

  """
  The named member accepts: they become the owner and the previous owner an administrator.
  """
  acceptOwnershipTransfer(id: ID!, password: String!): Boolean!

  """Lets an existing Cartly user act for the account."""
  addAccountMember(input: AddAccountMemberInput!): AccountMember!

  """Nothing can be booked in this time (existing bookings stay)."""
  addBookingBlock(bookableId: ID!, input: BookingBlockInput!): BookingBlock!

  """Adds codes of your own and/or generated unique ones."""
  addCouponCodes(discountId: ID!, input: CouponCodesInput!): Discount!

  """
  Adds a custom domain and returns the DNS records to publish. Needs the custom-domains plan feature.
  """
  addCustomDomain(hostname: String!): Domain!
  addCustomerAddress(customerId: ID!, input: CustomerAddressInput!): CustomerAddress!
  addEnquiryNote(body: String!, id: ID!): EnquiryDetails!
  addEventTicketType(eventId: ID!, input: EventTicketTypeInput!): EventRecord!
  addProductVariant(input: VariantInput!, productId: ID!): Product!

  """Fails with INSUFFICIENT_STOCK rather than going below reserved stock."""
  adjustStock(input: StockAdjustmentInput!): StockLevels!

  """
  Approves a buyer’s request: the tickets are voided and the money is returned through the order. CONFLICT if one was used meanwhile. Needs orders.refund.
  """
  approveTicketRefund(id: ID!, note: String): StaffTicketRefund!
  archiveEloraConversation(archived: Boolean!, id: ID!): Boolean!

  """Removes the notification from the inbox (kept for delivery history)."""
  archiveNotification(id: ID!): Boolean!
  archiveProduct(id: ID!): Product!
  assignConversation(id: ID!, userId: ID!): ConversationThread!
  assignEnquiry(agentId: ID!, id: ID!): EnquiryDetails!

  """
  Gives an active member of the business a role on this event (invite them to the business first, e.g. with the "Event staff" role). The caller must be able to do everything the role allows.
  """
  assignEventStaff(eventId: ID!, membershipId: ID!, role: EventStaffRole!): [EventStaffMember!]!
  assignPropertyAgent(agentId: ID!, id: ID!, role: String): Property!

  """
  Approves an authorisation request: connects the app to this business and issues a code.
  """
  authorizeApp(input: AppAuthorizationInput!): AppAuthorizationResult!

  """
  Signed in on Cartly: approve opening a business’s own dashboard. Needs an active membership and a registered dashboard address.
  """
  authorizeDashboard(
    """The business slug."""
    business: String!

    """PKCE S256 challenge."""
    codeChallenge: String!
    redirectUri: String!
    state: String!
  ): DashboardAuthorization!

  """
  Buys extra businesses until the end of the current paid period (pro rata); renewed with the plan.
  """
  buyExtraBusinesses(quantity: Int!): AddonCheckout!

  """Stops renewing an add-on; it applies until its period ends."""
  cancelAddon(id: ID!): AccountAddon!

  """
  Frees the place and emails the guest; `wholeSeries` cancels every open week of a series (required while an unpaid series is paid as one). An unpaid order is cancelled with it; refund a paid one from the order (refundOrder).
  """
  cancelBooking(id: ID!, reason: String!, wholeSeries: Boolean): BookingRecord!

  """
  Cancels the request before development starts. The onboarding fee is not refunded.
  """
  cancelCustomStorefrontRequest(reason: String): CustomStorefrontRequest!

  """
  A scheduled campaign goes back to draft; one being sent stops (what went out stays counted).
  """
  cancelEmailCampaign(id: ID!): EmailCampaign!

  """
  Stops sales, voids the tickets and tells their holders. Paid orders are refunded from the order (refundOrder), by staff who may refund.
  """
  cancelEvent(id: ID!, reason: String!): EventRecord!

  """
  The guest cancels an unpaid booking before its cancellation deadline (see canCancel).
  """
  cancelMyBooking(token: String!): ShopperBooking!

  """Gives up an order that is still waiting for payment."""
  cancelMyTicketOrder(token: String!): BuyerTicketOrder!

  """
  Releases reserved stock (unpaid) or restocks (paid). Paid orders also need a refund.
  """
  cancelOrder(id: ID!, reason: String!): Order!

  """Stops renewal; access continues to the end of the paid period."""
  cancelSubscription(reason: String!): PlanSubscription!
  cancelViewing(id: ID!, reason: String!): Viewing!

  """Signs out every other session."""
  changeCustomerPassword(currentPassword: String!, newPassword: String!): Boolean!

  """Changes the password and signs out every other session."""
  changePassword(input: ChangePasswordInput!): Boolean!

  """
  Upgrades (prorated payment, immediate on confirmation) or schedules a downgrade at period end.
  """
  changePlan(packagePriceId: ID!): PlanChange!

  """
  Moves the business to another Cartly subdomain. CONFLICT when someone else claimed it first.
  """
  changeSubdomain(subdomain: String!): SubdomainCheck!

  """
  Checks someone in by the code printed on their ticket. Needs the right to see attendees as well as to check in.
  """
  checkInEventTicket(checkPoint: String, code: String!, eventId: ID!): CheckInOutcome!

  """
  Checks a private event’s guest in by the code they requested. A use: a single-use code is spent (USED after). EXPIRED when its time ran out.
  """
  checkInWithAccessCode(checkPoint: String, code: String!, eventId: ID!): AccessCodeCheckIn!

  """
  Places the order (reserving stock) and starts payment. Retries with the same Idempotency-Key return the same order.
  """
  checkout(input: CheckoutInput!): CheckoutResult!
  chooseGoogleMerchantAccount(merchantId: String!): GoogleMerchantStatus!

  """
  Deprecated: onboarding no longer asks about domains. Records the choice; harmless.
  """
  chooseOnboardingDomain(choice: DomainChoice!): AccountOnboarding!

  """
  Forgets everything discovery saved about the account, and switches nearby alerts off.
  """
  clearEventDiscoveryPreferences: Boolean!

  """The owner withdraws the proposal, or the named member declines it."""
  closeOwnershipTransfer(id: ID!): Boolean!

  """A confirmed booking that has started."""
  completeBooking(id: ID!): BookingRecord!

  """
  Completes onboarding (CONFLICT lists unfinished steps). Returns the account’s set-up summary.
  """
  completeOnboarding: AccountOnboarding!

  """
  Records that the bank transfer for this order reached the business’s account; the order is then confirmed.
  """
  confirmBankTransfer(id: ID!, input: ConfirmBankTransferInput!): Order!

  """
  MANUAL confirmation. A paid resource must be paid first. The guest is emailed.
  """
  confirmBooking(id: ID!): BookingRecord!
  confirmTotpEnrollment(code: String!): RecoveryCodes!

  """
  With an API key from Bing Webmaster Tools → Settings → API access. Stored encrypted.
  """
  connectBingWebmaster(apiKey: String!): SearchEngineConnection!

  """
  Connects a domain the client owns (pending until its DNS records prove control). CONFLICT if another business has verified it.
  """
  connectCustomStorefrontDomain(hostname: String!): Domain!

  """
  Google’s sign-in page; Google sends the browser back to returnTo (a page of this business’s dashboard) with ?googleMerchant=connected|choose-account|no-account|cancelled|error|expired.
  """
  connectGoogleMerchantCenter(returnTo: String!): String!

  """
  The Google consent URL to open. Google sends the browser back to `returnTo` (your dashboard) with ?searchConsole=connected|cancelled|error|expired.
  """
  connectGoogleSearchConsole(returnTo: String!): String!

  """Checks the keys with Paystack, then stores the secret key encrypted."""
  connectPaystack(input: ConnectPaystackInput!): PaymentSettings!

  """
  Explicit agreement to continue on a paid price when the promotion ends. Without it, an ended promotion never becomes a paid plan.
  """
  consentToGrantConversion(grantId: ID!, packagePriceId: ID!): PromotionalGrant!
  contactBusiness(input: CustomerConversationInput!): StartedConversation!

  """The new, open counter-offer."""
  counterOffer(amount: Decimal!, conditions: String, id: ID!): Offer!

  """
  Creates a client account; the caller becomes its owner. Businesses are created under an account.
  """
  createAccount(input: CreateAccountInput!): Account!
  createAgency(input: AgencyInput!): Agency!
  createAgentProfile(input: AgentInput!): Agent!
  createApiKey(input: ApiKeyInput!): CreatedApiKey!

  """
  CONFLICT when the slug is taken. Paid (FULL) resources name the product variant that prices them.
  """
  createBookable(input: BookableInput!): Bookable!

  """
  Books it (needs Idempotency-Key; X-Customer-Token links it to the signed-in shopper). Paid resources return a payment session: pay before booking.holdExpiresAt. BOOKING_UNAVAILABLE when it was taken meanwhile.
  """
  createBooking(input: CreateBookingInput!): PlacedBooking!

  """
  Creates a business; the caller becomes its owner. It goes under the account in X-Account-Id, else the caller’s only account, else a new account the caller owns.
  """
  createBusiness(input: CreateBusinessInput!): Business!
  createCart: NewCart!
  createCategory(input: CategoryInput!): Category!

  """CONFLICT when the slug is taken."""
  createCollection(input: CollectionInput!): Collection!
  createCustomer(input: CustomerInput!): Customer!
  createDeveloperApp(input: CreateDeveloperAppInput!): DeveloperAppWithSecret!
  createDiscount(input: DiscountInput!): Discount!

  """A draft."""
  createEmailCampaign(input: EmailCampaignInput!): EmailCampaign!
  createEnquiry(input: EnquiryInput!): Enquiry!
  createEntityDefinition(input: CreateEntityDefinitionInput!): EntityDefinition!
  createEntityRecord(data: JSON!, definitionKey: String!): EntityRecord!

  """A draft. CONFLICT when the slug is taken."""
  createEvent(input: EventInput!): EventRecord!

  """
  Prepays the business’s Cartly service-fee balance: an invoice and its payment session. Credited once the provider confirms.
  """
  createFeeTopUp(input: FeeTopUpInput!): PaymentSessionCreated!
  createInventoryLocation(input: InventoryLocationInput!): InventoryLocation!

  """
  A session to pay one of the account’s open invoices (send the account as accountId).
  """
  createInvoicePaymentSession(invoiceId: ID!, returnUrl: String): PaymentSessionCreated!
  createLease(input: LeaseInput!): Lease!

  """
  Single-use ticket for the realtime SSE stream (EventSource cannot send headers).
  """
  createNotificationStreamTicket: StreamTicket!

  """Counts against catalog.products.max."""
  createProduct(input: ProductInput!): Product!
  createProductAttribute(input: AttributeInput!): Attribute!

  """
  Counts against real_estate.properties.max. An agent creating a listing becomes its listing agent.
  """
  createProperty(input: PropertyInput!): Property!
  createPropertyClient(input: ClientInput!): PropertyClient!
  createPropertyLocation(input: LocationInput!): PropertyLocation!
  createPropertyType(input: PropertyTypeInput!): PropertyTypeRef!
  createRole(input: CreateRoleInput!): Role!

  """
  Needs tenant.settings.manage, events.manage or real_estate.properties.write.
  """
  createSavedLocation(input: SavedLocationInput!): SavedLocation!

  """
  Starts a self-built storefront and returns its key, once. The business’s own domains then go live on their TXT record alone, pointed at the merchant’s host. FEATURE_NOT_AVAILABLE without storefront.self_built; CONFLICT if Cartly built the business a store or one exists.
  """
  createSelfBuiltStorefront(siteUrl: String): SelfBuiltStorefrontKey!
  createServiceArea(input: ServiceAreaInput!): ServiceArea!
  createShippingMethod(input: ShippingMethodInput!): ShippingMethod!

  """A new page (a draft), empty or from a template page."""
  createStorefrontPage(input: CreateStorefrontPageInput!): StorefrontBuilderPageDetail!

  """A 30-minute link to the page’s draft on the store (`/preview?token=`)."""
  createStorefrontPreviewLink(pageId: ID!): StorefrontPreviewLink!
  createTaxRate(input: TaxRateInput!): TaxRate!

  """At most 10 per business. The signing secret is in the result only."""
  createWebhookEndpoint(input: WebhookEndpointInput!): WebhookEndpointWithSecret!
  customerLogin(email: String!, password: String!): CustomerSessionToken!

  """Ends the session named by X-Customer-Token."""
  customerLogout: Boolean!

  """
  Finishes a Google or Apple sign-in: trades the one-time `code` the API sent to the store’s return page for a session. Works once, within two minutes, at that store only.
  """
  customerProviderSignIn(code: String!): CustomerSessionToken!

  """
  Approves (runs) or rejects a proposal. Only the user it was proposed to can decide; it runs only if they still have permission and the record is unchanged.
  """
  decideEloraProposal(decision: EloraDecision!, id: ID!): EloraProposal!

  """
  Declines a buyer’s request, saying why; the tickets stay valid. Needs orders.refund.
  """
  declineTicketRefund(id: ID!, note: String!): StaffTicketRefund!

  """Only while it has no bookings; unpublish it otherwise."""
  deleteBookable(id: ID!): Boolean!

  """
  Deletes a category and everything in it: its products (as deleteProduct, which needs catalog.products.publish), property listings (as deleteProperty, which needs real_estate.properties.publish and real_estate.properties.manage_all) or services (needs bookings.manage), including ones also in another category. Refused, with nothing deleted, while it has sub-categories or a service in it has bookings.
  """
  deleteCategory(id: ID!): Boolean!
  deleteCollection(id: ID!): Boolean!
  deleteCustomerAddress(addressId: ID!, customerId: ID!): Boolean!

  """CONFLICT while a discount is kept to it."""
  deleteCustomerGroup(id: ID!): Boolean!

  """CONFLICT while a discount is kept to it."""
  deleteCustomerSegment(id: ID!): Boolean!

  """CONFLICT once orders used it: switch it off instead."""
  deleteDiscount(id: ID!): Boolean!

  """Deletes the conversation, its messages and proposals."""
  deleteEloraConversation(id: ID!): Boolean!
  deleteEloraPreference(id: ID!): Boolean!

  """Drafts, or cancelled campaigns that sent nothing."""
  deleteEmailCampaign(id: ID!): Boolean!

  """Only a draft with no ticket orders."""
  deleteEvent(id: ID!): Boolean!

  """Deletes the conversation and its messages."""
  deleteEventEloraConversation(id: ID!): Boolean!

  """
  Deletes a product. One with no history is removed; one that was ordered, moved stock or is booked is kept for that history, archived and hidden everywhere, with its slug freed.
  """
  deleteProduct(id: ID!): Boolean!
  deleteProductReview(id: ID!): Boolean!

  """
  Deletes a property: kept for its enquiries, viewings and orders, but archived and hidden everywhere, with its slug freed.
  """
  deleteProperty(id: ID!): Boolean!
  deleteRole(id: ID!): Boolean!

  """Archives it: no longer offered; events held there keep it."""
  deleteSavedLocation(id: ID!): Boolean!
  deleteSeoPage(id: ID!): Boolean!

  """Deleting an automatic redirect makes the old address answer 404."""
  deleteSeoRedirect(id: ID!): Boolean!
  deleteServiceArea(id: ID!): Boolean!
  deleteServiceReview(id: ID!): Boolean!
  deleteShopperAddress(id: ID!): Boolean!

  """Deletes a page (archived: its path is freed, its history kept)."""
  deleteStorefrontPage(id: ID!): Boolean!
