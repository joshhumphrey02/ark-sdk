  """A template with its page documents, for a preview."""
  storefrontTemplate(key: String!): StorefrontTemplateDetail!

  """
  Every template; those made for this business’s types first (`recommended`).
  """
  storefrontTemplates: [StorefrontTemplateSummary!]!

  """
  The published header, footer, theme and menu for the store’s layout. Null when the store doesn’t use the builder.
  """
  storefrontVisualChrome: StorefrontVisualChrome

  """
  The published builder page at `path` ("/" for home). Null when the store doesn’t use the builder or nothing is published there: fall back to the classic page.
  """
  storefrontVisualPage(path: String!): StorefrontVisualPage

  """Current subscription (if any) and effective entitlements."""
  subscription: SubscriptionOverview!

  """Subscription history, newest first."""
  subscriptionHistory(page: PageInput): SubscriptionEventPage!
  taxRates: [TaxRate!]!

  """
  Every ticket booked across the business’s events, newest first, for business-wide event staff. Amounts only with events.sales.read.
  """
