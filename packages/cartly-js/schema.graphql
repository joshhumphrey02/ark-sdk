  unreadNotificationCount(tenantId: ID): Int!

  """
  Use of every limited resource against the account’s plan, summed over all its businesses (business view).
  """
  usage: [UsageItem!]!

  """
  The signed-in user and the businesses they belong to (only its own business for a dashboard session).
  """
  viewer: Viewer!

  """Calendar view, at most 500, earliest first."""
  viewings(filter: ViewingFilter): [Viewing!]!

  """An endpoint’s deliveries, newest first."""
