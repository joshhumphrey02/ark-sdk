  unpublishProduct(id: ID!): Product!

  """Takes a page off the store; its draft and history stay."""
  unpublishStorefrontPage(id: ID!): StorefrontBuilderSite!

  """
  Removes a product or property from the list; removing what isn’t saved changes nothing.
  """
  unsaveItem(kind: SavedItemKind!, slug: String!): SavedItemState!
  updateAgency(id: ID!, input: AgencyInput!): Agency!
  updateAgentProfile(id: ID!, input: AgentInput!): Agent!
  updateBookable(id: ID!, input: BookableInput!): Bookable!
  updateBranding(input: UpdateBrandingInput!): Business!
  updateBusinessBrand(input: BrandSettingsInput!): BusinessBrand!
  updateBusinessProfile(input: UpdateBusinessProfileInput!): Business!
  updateBusinessSettings(input: UpdateBusinessSettingsInput!): Business!
  updateCategory(id: ID!, input: CategoryInput!): Category!
  updateCollection(id: ID!, input: CollectionInput!): Collection!
  updateCustomer(id: ID!, input: CustomerInput!): Customer!
  updateCustomerAccount(firstName: String, lastName: String, phone: String): CustomerAccountProfile!
  updateDeveloperApp(id: ID!, input: UpdateDeveloperAppInput!): DeveloperApp!
  updateDiscount(id: ID!, input: DiscountUpdateInput!): Discount!

  """
  Takes part in Cartly Discover (or stops). Products appear once published, with a photo and something to buy.
  """
  updateDiscoverSettings(enabled: Boolean!, mode: DiscoverMode): DiscoverSettings!

  """Drafts only."""
  updateEmailCampaign(id: ID!, input: EmailCampaignInput!): EmailCampaign!

  """
  A custom SMTP server is connected to and logged in to before it is saved.
  """
  updateEmailSettings(input: EmailSettingsInput!): EmailSettings!

  """
  A changed field list becomes a new version; changes that existing records would not satisfy are refused.
  """
  updateEntityDefinition(input: UpdateEntityDefinitionInput!, key: String!): EntityDefinition!

  """
  Merges data into the record; validated against the current definition version.
  """
  updateEntityRecord(data: JSON!, definitionKey: String!, id: ID!, version: Int!): EntityRecord!

  """
  Ticket holders are told when the date, venue or format of a published event changes.
  """
  updateEvent(id: ID!, input: EventInput!): EventRecord!

  """
  CONFLICT when changing the price of a type that has sold, or lowering its quantity below what is sold or held.
  """
  updateEventTicketType(id: ID!, input: EventTicketTypeInput!): EventRecord!

  """
  Replaces the whole home page (send all of it). Images must be READY images of this business. Audited.
  """
  updateHomePage(input: StorefrontHomePageInput!): StorefrontHomePage!
  updateMyProfile(input: UpdateProfileInput!): Viewer!

  """
  Essential notifications (security, billing failures) are sent regardless.
  """
  updateNotificationPreferences(preferences: [NotificationPreferenceInput!]!): [NotificationPreference!]!
  updatePaymentSettings(input: PaymentSettingsInput!): PaymentSettings!
  updateProduct(id: ID!, input: ProductInput!): Product!
  updateProductVariant(input: VariantInput!, productId: ID!, variantId: ID!): Product!
  updateProperty(id: ID!, input: PropertyInput!): Property!
  updateRole(id: ID!, input: UpdateRoleInput!): Role!

  """Events already held there keep the venue details they were given."""
  updateSavedLocation(id: ID!, input: SavedLocationInput!): SavedLocation!
  updateSeoSettings(input: UpdateSeoSettingsInput!): SeoSettings!
  updateServiceArea(id: ID!, input: ServiceAreaInput!): ServiceArea!
  updateShippingMethod(id: ID!, input: ShippingMethodInput!): ShippingMethod!

  """
  Title, path, SEO and menu settings. They apply to the live page at once.
  """
  updateStorefrontPageSettings(id: ID!, input: UpdateStorefrontPageSettingsInput!): StorefrontBuilderPage!

  """Changes the draft theme; it goes live with the next publish."""
  updateStorefrontTheme(baseRevision: Int!, theme: JSON!): StorefrontBuilderSite!

  """
  CONFIRMED, COMPLETED, NO_SHOW (or use rescheduleViewing / cancelViewing).
  """
  updateViewingStatus(agentId: ID, id: ID!, status: ViewingStatus!): Viewing!
  updateWebhookEndpoint(id: ID!, input: WebhookEndpointInput!): WebhookEndpoint!

  """
  Checks the DNS records now instead of waiting for the next scheduled check.
  """
  verifyCustomDomain(id: ID!): Domain!
  verifyCustomerEmail(token: String!): Boolean!

  """
  Voids one unused ticket; its place goes back on sale. Money is returned through the order’s refund.
  """
  voidEventTicket(reason: String!, ticketId: ID!): Boolean!

  """Takes the event off a marketplace. Tickets sold there stay valid."""
  withdrawEventFromMarketplace(eventId: ID!, marketplace: String!): [EventDistribution!]!
}

