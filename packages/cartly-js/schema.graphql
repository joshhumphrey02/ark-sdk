  body: String
  collectionSlug: String

  """At most 60 characters."""
  eyebrow: String

  """Omit for a new section; send it back to keep a section’s id."""
  id: ID
  imageAlts: [String!]

  """READY images of this business, at most 12."""
  imageAssetIds: [ID!]
  itemLimit: Int
  kind: StorefrontHomeSectionKind!

  """
  Null: the store’s own default. GRID or CAROUSEL for COLLECTIONS, FEATURED_PRODUCTS, FEATURED_LISTINGS, RECORDS, BOOKABLES, GALLERY and REVIEWS; SPLIT or BANNER for FEATURE_PANEL and CALL_TO_ACTION; none for the others.
  """
  layout: StorefrontSectionLayout
  link: StorefrontLinkInput
  recordType: String

  """At most 120 characters."""
  title: String

  """
  FEATURE_PANEL, CALL_TO_ACTION and RICH_TEXT only: a video of this business, READY or still processing.
  """
  videoAssetId: ID
  visible: Boolean!
}

input UpdateProfileInput {
  displayName: String

  """null clears the phone number."""
  phone: String
}

input NotificationPreferenceInput {
  category: NotificationCategory!

  """EMAIL or PUSH; in-app notifications are always kept."""
  channel: NotificationChannel!
  enabled: Boolean!
}

input PaymentSettingsInput {
  bankTransfer: BankTransferSettingsInput
  cashOnDelivery: CashOnDeliverySettingsInput
  onlinePaymentsEnabled: Boolean
}

input BankTransferSettingsInput {
  accountName: String
  accountNumber: String
  bankName: String
  enabled: Boolean!
  holdHours: Int
  instructions: String
}

input CashOnDeliverySettingsInput {
  countries: [String!]
  enabled: Boolean!
  instructions: String
  maxOrderTotal: String
  regions: [String!]
}

input UpdateRoleInput {
  description: String
  name: String
  permissions: [String!]
}

input UpdateSeoSettingsInput {
  aiCrawlerPolicy: SeoAiCrawlerPolicy

  """The code, or the whole meta tag from Bing Webmaster Tools."""
  bingSiteVerification: String

  """The code, or the whole meta tag from Search Console."""
  googleSiteVerification: String
  indexNowEnabled: Boolean
  indexing: SeoIndexing
  llmsTxtEnabled: Boolean
  routes: SeoRoutesInput
  seoDescription: String
  seoTitle: String

  """
  What the website is called (1–160 characters), e.g. a person’s name for a portfolio.
  """
  siteName: String
  socialImageAssetId: ID

  """With %s for the page title, e.g. "%s | Ada Fabrics"."""
  titleTemplate: String
  twitterHandle: String
}

input SeoRoutesInput {
  category: String
  collection: String
  privatePaths: [String!]
  product: String
  property: String
  search: String
}

input UpdateStorefrontPageSettingsInput {
  navigationOrder: Int
  noIndex: Boolean
  path: String
  seoDescription: String
  seoTitle: String
  showInNavigation: Boolean
  socialImageAssetId: ID
  title: String
}

type Subscription {
  """
  New messages in one of the business’s conversations (WebSocket). Refetch `conversation(id)` on each event.
  """
  conversationActivity(id: ID!): ConversationActivity!

  """
  Every check-in at the event as it is recorded, from any device (WebSocket; tenantId in connection_init). For whoever may check in there. Refetch eventCheckInStats after a reconnect.
  """
  eventCheckInActivity(eventId: ID!): EventCheckInActivity!

  """
  New messages in the customer’s conversation (WebSocket; send storefrontHost and conversationToken in connection_init).
  """
  myConversationActivity: ConversationActivity!

  """
  The signed-in user’s notifications as they arrive (WebSocket, graphql-ws). Optionally only one business’s.
  """
  notificationReceived(tenantId: ID): LiveNotification!

  """
  New orders, payments, transfers, status changes and refunds of the business (WebSocket). Refetch `order(id)` or the list on each event.
  """
  orderActivity: OrderActivity!

  """
  Changes to the order a payment session pays for (WebSocket; no headers needed). Refetch `paymentSession(token)` on each event. Order payments only.
  """
  paymentSessionActivity(token: String!): PaymentSessionActivity!
}

"""
A new message in a conversation; ids only, refetch the thread for its content.
"""
type ConversationActivity {
  conversationId: ID!
  createdAt: DateTime!
  messageId: ID!
  senderType: MessageSenderType!
}

"""
A change to an event’s attendance, live. No names: refetch eventCheckInStats or eventCheckIns for detail.
"""
type EventCheckInActivity {
  """Tickets admitted by this change."""
  admitted: Int!
  at: DateTime!
  checkPoint: String
  eventId: ID!
  kind: CheckInActivityKind!
  reason: String

  """Attempts recorded by this change."""
  recorded: Int!

  """One attempt’s outcome; null for SYNC."""
  result: EventCheckInResult
  ticketTypeName: String
}

enum CheckInActivityKind {
  """Someone was checked in by their ticket code."""
  MANUAL

  """A QR code was scanned."""
  SCAN

  """A scanner uploaded scans it made offline."""
  SYNC
}

"""
A notification as it is delivered live. Query `notification(id)` for read state and data.
"""
type LiveNotification {
  actionUrl: String
  body: String!
  category: NotificationCategory!
  createdAt: DateTime!
  id: ID!
  priority: NotificationPriority!
  tenantId: ID
  title: String!
  type: String!
}

type OrderActivity {
  at: DateTime!
  kind: OrderActivityKind!
  orderId: ID!
  orderNumber: Int
}

"""
What happened to an order. Refetch the order (or the payment session) for its new state.
"""
enum OrderActivityKind {
  """The payment was verified."""
  PAID

  """The provider declined the payment."""
  PAYMENT_FAILED

  """A new order (paid online later, bank transfer, or cash on delivery)."""
  PLACED

  """A refund completed."""
  REFUNDED

  """
  Fulfilment status changed (processing, shipped, delivered, cancelled…).
  """
  STATUS_CHANGED

  """Staff could not find the transfer."""
  TRANSFER_REJECTED

  """The shopper reported a bank transfer."""
  TRANSFER_SUBMITTED
}

type PaymentSessionActivity {
  at: DateTime!
  kind: OrderActivityKind!
}
