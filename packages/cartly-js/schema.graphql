  transferEventTicket(code: String!, input: TicketTransferInput!): Boolean!
  unassignPropertyAgent(agentId: ID!, id: ID!): Property!

  """
  Call before signing out: this install stops getting the signed-in user’s pushes.
  """
  unlinkAppDevice(deviceId: String!): Boolean!

  """Back to a draft, while nothing has been sold or held."""
