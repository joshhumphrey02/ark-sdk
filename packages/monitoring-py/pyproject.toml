[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nerdstack-monitoring"
version = "0.1.0"
description = "Nex monitoring for Python: errors with stack frames, breadcrumbs, users and requests, crash reports, heartbeats and releases."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nerdstack" }]
keywords = ["nex", "monitoring", "error-reporting", "observability", "fastapi", "django", "flask"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Framework :: Django",
  "Framework :: FastAPI",
  "Framework :: Flask",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "starlette>=0.37", "ruff>=0.9", "mypy>=1.11"]

[project.urls]
Homepage = "https://nex.nerdstackgrp.com"
Documentation = "https://github.com/joshhumphrey02/ark-sdk/tree/master/packages/monitoring-py#readme"
Repository = "https://github.com/joshhumphrey02/ark-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/nerdstack_monitoring"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nerdstack_monitoring"]
mypy_path = "src"
